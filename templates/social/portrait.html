<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social — Portrait 1080x1350 — Scaffold</title>
<script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme { --color-cream:#FFFBF0; --color-charcoal:#141410; --color-gold:#C9A86A; --color-red:#C1272D; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f5f1e8}
  .font-serif{font-family:'Playfair Display',serif}
  .font-sans{font-family:'Montserrat',sans-serif}
  /* SOCIAL PORTRAIT — 1080x1350 (4:5 feed, max real estate) */
  section{width:1080px;height:1350px;position:relative;overflow:hidden;background:#FFFBF0}
</style>
</head>
<body>
<!--
  SOCIAL PORTRAIT SCAFFOLD — 1080×1350 (4:5)
  Use when you want max feed height. Same system as square, more vertical air.
  Render: python3 scripts/generate.py social-portrait templates/social/portrait.html --format png
-->
<section class="flex flex-col">
  <div class="absolute top-0 left-0 right-0 h-[6px]" style="background:#C1272D"></div>
  <div class="absolute inset-[24px] top-[14px] border pointer-events-none" style="border-color:rgba(201,168,106,0.14)"></div>

  <div class="relative z-10 pt-[28px] px-[32px] flex items-center justify-between">
    <span class="font-sans text-[18px] font-bold tracking-[0.32em] uppercase" style="color:#C1272D">BRAND</span>
    <span class="font-sans text-[15px] font-bold tracking-[0.22em] uppercase px-3 py-1.5 rounded-full" style="background:#C1272D; color:#FFFBF0">01/30</span>
  </div>
  <div class="relative z-10 mx-[32px] mt-2 h-[1px]" style="background:linear-gradient(90deg, #C1272D 0%, rgba(201,168,106,0.35) 42%, transparent 100%)"></div>

  <div class="relative z-10 flex-1 flex flex-col items-center justify-center px-[32px] text-center">
    <p class="font-sans text-[18px] font-extrabold tracking-[0.34em] uppercase" style="color:rgba(20,20,16,0.52)">Eyebrow · Category</p>
    <h1 class="font-serif font-black leading-[0.82] mt-4" style="color:#141410; font-size:110px; letter-spacing:-0.05em">
      <span class="block font-serif font-extrabold" style="font-size:46px; letter-spacing:0.12em; color:rgba(20,20,16,0.42); text-transform:uppercase">Hook line one</span>
      <span class="block">HOOK</span>
      <span class="block font-serif font-black italic -mt-2" style="color:#C1272D; font-size:108px">here.</span>
    </h1>
    <p class="font-sans mt-4 text-center" style="color:rgba(20,20,16,0.62); font-size:22px; line-height:1.40; font-weight:600">Support line — three lines max,<br>keep it punchy, caption holds the rest.<br>No more than 15 words total.</p>
    <div class="mt-4 h-[2px] w-[88px]" style="background:#C9A86A"></div>
  </div>

  <div class="relative z-10 mx-[32px] mb-[28px] rounded-[1.4rem] px-6 py-5 flex items-center justify-between" style="background:#141410">
    <div>
      <p class="font-serif font-black leading-none" style="color:#FFFBF0; font-size:20px">Name · Title</p>
      <p class="font-sans text-[13px] font-bold tracking-[0.18em] uppercase" style="color:rgba(201,168,106,0.85)">Swipe → Next</p>
    </div>
    <div class="px-5 py-2.5 rounded-full font-sans text-[17px] font-extrabold" style="background:#C1272D; color:white">CTA →</div>
  </div>
  <div class="relative z-10 mx-[32px] pb-[22px] flex items-center justify-between">
    <span class="font-sans text-[12px] font-semibold tracking-[0.18em] uppercase" style="color:rgba(20,20,16,0.32)">Location · Context</span>
    <span class="font-sans text-[12px] font-bold tracking-[0.20em] uppercase" style="color:rgba(193,39,45,0.85)">#Hashtag</span>
  </div>
</section>
</body>
</html>
