<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ANO REMIT — "Finish your week." (replica of reference)</title>
<script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  /* ------------------------------------------------------------------
     Replica of the ANO REMIT 4:5 portrait ad, built from measurements of
     the 1080x1350 reference (scripts/fidelity_qa.py + direct pixel scans).

     MEASURED OFF THE REFERENCE (px @1080x1350):
       brand green          #08A705  (headline AND badge are the same green)
       headline ink         x 218-878, line1 baseline 953, line2 baseline 1027
       headline cap height  57px          -> line spacing 74px
       badge slab           x 214-436 (223w)  y 1079-1218 (140h)  radius ~42
       download text        cap top 1098, second line top 1122 -> 24px leading
       store buttons        139x45 each, y 1155-1199, left 468, gap 41
       logo pill            x 142-307 (165w)  y 143-208 (65h)
       fade                 saturates to #FBEFE1..#FFFFFF by the bottom edge

     typeface: Poppins ExtraBold (geometric, single-storey, round i-dots,
     angled e terminal). Identified from letterforms, not assumed.

     THE PHOTOGRAPH IS A PLACEHOLDER. The reference is built on a licensed
     photograph I do not have, plus the ANO REMIT circular emblem (a brand
     asset). Everything else here is rebuilt. See the .photo rule.
     ------------------------------------------------------------------ */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px}
  body{background:#111}
  section{position:relative;width:1080px;height:1350px;overflow:hidden;background:#efe3cf}

  :root{
    --green:#08A705;
    --fade:#FBEFE1;
    --ink:#0B0B0B;
    --logo-ink:#12330F;

    --head-size:81px;
    --head-lh:74px;
    --head-top:888px;
    --head-left:213.3px;
    --head-sx:0.9336;

    --ghost-top:150px;
    --ghost-right:0px;
    --ghost-size:571px;
    --ghost-sx:0.328;
    --ghost-op:0.16;
  }

  /* ---------- PLACEHOLDER PHOTOGRAPH ----------
     NOT the reference photo. The real image is a licensed photograph of a
     person in yellow headphones, warm amber tones, out-of-focus furniture
     behind. This warm gradient stands in so the composition reads; drop the
     real photo in and delete this rule. */
  .photo{
    position:absolute;inset:0;
    background:
      radial-gradient(58% 42% at 26% 34%, #d9a869 0%, rgba(217,168,105,0) 72%),
      radial-gradient(46% 34% at 72% 22%, #eacb8d 0%, rgba(234,203,141,0) 70%),
      radial-gradient(40% 30% at 50% 62%, #a8763c 0%, rgba(168,118,60,0) 70%),
      linear-gradient(158deg,#e3bd83 0%,#c79b57 42%,#8c6a37 100%);
  }

  /* milky veil: straight bottom-up gradient + an elliptical glow bottom-centre */
  .fade{
    position:absolute;inset:0;
    background:
      radial-gradient(78% 46% at 42% 100%, #FFFFFF 0%, rgba(255,255,255,0.92) 34%, rgba(255,255,255,0) 72%),
      linear-gradient(to top,
        var(--fade) 0%, rgba(251,239,225,0.97) 18%, rgba(251,239,225,0.62) 38%,
        rgba(251,239,225,0.18) 56%, rgba(251,239,225,0) 72%);
  }

  /* giant watermark: UPRIGHT letters stacked down the right side (verified by
     zooming a single letter -- a rotated word would show a T lying on its side).
     The reference's row-residual profile gives letter bands starting at y~197 on
     a ~108px pitch, so: 8 lines, 108px leading, faint white.
     NOT fully converged: this is a ~13% white overlay whose contrast depends
     entirely on the photograph behind it, so it can only be tuned against the
     real photo, not the placeholder below. */
  .ghost{
    position:absolute;left:470px;width:500px;top:194px;
    font-family:'Poppins',sans-serif;font-weight:800;
    font-size:145px;line-height:108px;letter-spacing:0;
    text-align:center;color:#fff;opacity:0.13;
  }

  /* ---------- logo pill ---------- */
  .logo{
    position:absolute;left:136px;top:143px;width:171px;height:65px;
    background:#fff;border-radius:33px;display:flex;align-items:center;gap:8px;
    padding:0 13px 0 8px;
  }
  /* the emblem is a brand asset; this stand-in holds its footprint + colours */
  .logo .mark{width:47px;height:47px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 38% 34%,#2fbf3a 0%,#0E8F13 62%,#0a6b0e 100%);
    position:relative;overflow:hidden}
  .logo .mark::after{content:'';position:absolute;inset:14% 8% 30% 8%;
    border-radius:50%;border:2.5px solid rgba(255,255,255,.85);border-bottom-color:transparent;
    transform:rotate(-24deg)}
  .logo .word{font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;
    letter-spacing:.055em;color:var(--logo-ink);white-space:nowrap}

  /* ---------- headline ---------- */
  .headline{
    position:absolute;left:var(--head-left);top:var(--head-top);
    font-family:'Poppins',sans-serif;font-weight:800;
    font-size:var(--head-size);line-height:var(--head-lh);
    letter-spacing:-0.012em;color:var(--green);white-space:nowrap;
    transform:scaleX(var(--head-sx));transform-origin:0 0;
  }

  /* ---------- bottom cluster ---------- */
  .badge{
    position:absolute;left:214px;top:1079px;width:223px;height:140px;
    background:var(--green);border-radius:42px;
    display:flex;align-items:center;padding:0 16px 0 20px;
  }
  .badge p{
    font-family:'Poppins',sans-serif;font-style:italic;font-weight:600;
    font-size:20px;line-height:25px;color:#fff;letter-spacing:-0.005em;
  }
  .plane{position:absolute;left:364px;top:1073px;width:56px;height:50px}

  .dl{
    position:absolute;left:468px;top:1093px;
    font-family:'Poppins',sans-serif;font-weight:600;font-size:23px;line-height:24px;
    color:var(--ink);letter-spacing:-0.005em;white-space:nowrap;
  }

  .btns{position:absolute;left:468px;top:1155px;display:flex;gap:41px}
  .btn{
    width:139px;height:45px;background:#000;border-radius:9px;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:'Poppins',sans-serif;font-weight:500;font-size:18px;color:#fff;
    letter-spacing:-0.01em;
  }
</style>
</head>
<body>
<section>
  <div class="photo"></div>
  <div class="fade"></div>
  <div class="ghost">T<br>O<br>G<br>E<br>T<br>H<br>E<br>R</div>

  <div class="logo">
    <span class="mark"></span>
    <span class="word">ANO REMIT</span>
  </div>

  <div class="headline">Finish your week.<br>Protect your rest.</div>

  <div class="badge">
    <p>Fast, secure<br>transfers to keep<br>your loved ones<br>supported.</p>
  </div>
  <svg class="plane" viewBox="0 0 32 32" aria-hidden="true">
    <path fill="#ffffff" d="M30.5 1.5 2.4 13.1l9.2 3.6z"/>
    <path fill="#eef1f4" d="M30.5 1.5 11.6 16.7l2.9 13.0z"/>
    <path fill="#123F18" d="M11.6 16.7 30.5 1.5 14.5 29.7z" opacity=".9"/>
  </svg>

  <div class="dl">Download the Alpha &amp;<br>Omega App Today!</div>

  <div class="btns">
    <div class="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#00A0FF" d="M3.6 1.8A2 2 0 0 0 3 3.2v17.6a2 2 0 0 0 .6 1.4L14.2 12z"/>
        <path fill="#00E676" d="M5.1 1.3 17.6 8.4 14.2 12 3.6 1.8z"/>
        <path fill="#FFCE00" d="M17.6 8.4l2.9 1.7a1.4 1.4 0 0 1 0 2.4l-2.9 1.7L14.2 12z"/>
        <path fill="#FF3A44" d="M3.6 22.2 14.2 12l3.4 3.6L5.1 22.7z"/>
      </svg>
      <span>Google Play</span>
    </div>
    <div class="btn">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#fff" d="M16.4 1.4c0 1.1-.4 2.2-1.1 3-.8.9-2 1.5-3 1.5-.1-1.1.4-2.3 1.1-3 .8-.9 2.1-1.5 3-1.5zM20.9 17.2c-.6 1.3-.8 1.8-1.5 3-1 1.6-2.4 3.5-4.1 3.5-1.5 0-1.9-1-4-1s-2.5 1-4.1 1c-1.7 0-3.1-1.8-4-3.3C.1 15.6-.2 10.4 1.5 7.6 2.8 5.6 4.8 4.5 6.6 4.5c1.9 0 3.1 1 4.6 1 1.5 0 2.4-1 4.6-1 1.6 0 3.4.9 4.6 2.4-4.1 2.2-3.4 8 .5 10.3z"/>
      </svg>
      <span>App Store</span>
    </div>
  </div>
</section>
</body>
</html>
